<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <title>MesaiGo</title>
    <style>
      html,body{margin:0;height:100%;background:#070b14;color:#fff;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
      body{background:radial-gradient(420px 420px at 50% 38%,rgba(22,119,255,.22),transparent 70%),#070b14}
      main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
      img{width:80px;height:80px;margin-bottom:24px}
      h1{font-size:21px;margin:0 0 8px}
      p{color:rgba(255,255,255,.6);margin:0 0 28px;font-size:15px;line-height:1.5}
      button{background:#1677ff;color:#fff;border:0;border-radius:16px;height:54px;padding:0 32px;font-size:16px;font-weight:600;box-shadow:0 0 40px -6px rgba(22,119,255,.8)}
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>İnternet bağlantısı yok</h1>
      <p>Giriş-çıkış işlemi için internet bağlantısı gereklidir.</p>
      <button onclick="location.reload()">Tekrar Dene</button>
    </main>
  </body>
</html>
